<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Enigma Development Studio Website">
    <meta name="keywords" content="Enigma, Studio, Development, Enigma Iran">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ENIGMA Development Studio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-lg-2">
                    <div class="header__logo">
                        <a href="./index.html"><img src="img/logo.png" alt="enigma logo"></a>
                    </div>
                </div>
                <div class="col-lg-10">
                    <div class="header__nav__option">
                        <nav class="header__nav__menu mobile-menu">
                            <ul>
                                <li><a href="./index.html">Main</a></li>
                                <li class="active"><a href="./Products.html">Products</a></li>
                                <li><a href="./Blog.html">Blog</a></li>
                            </ul>
                        </nav>
                        <div class="header__nav__social">
                            <a href="https://x.com/enidevstudio"><i class="fa fa-twitter"></i></a>
                            <a href="https://instagram.com/enigmadevelopmentstudio"><i class="fa fa-instagram"></i></a>
                            <a href="https://www.youtube.com/@EnigmaDevStudio"><i class="fa fa-youtube-play"></i></a>
                            <a href="https://github.com/enigmadevstudio"><i class="fa fa-github"></i></a>
                            <a href="https://t.me/enigmadevelopmentstudio"><i class="fa fa-telegram"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="mobile-menu-wrap"></div>
        </div>
    </header>
    <!-- Header -->

    <!-- Banner -->
    <div class="banner-option spad set-bg" data-setbg="img/banner-bg.jpg">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <div class="banner__text">
                        <h2>PRODUCTS</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Banner -->

    <!-- Product -->
    <section class="product spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <ul class="product__filter">
                        <li class="active" data-filter="*">All</li>
                        <li data-filter=".game">Game</li>
                    </ul>
                </div>
            </div>
            <div class="row product__gallery">

                <!-- ITEM -->
                <div class="col-lg-4 col-md-6 col-sm-6 mix game">
                    <div class="product__item">
                        <div class="product__item__content set-bg" data-setbg="img/products/sample.jpg">
                            <div class="product__item__text">
                                <h4>Sample Post In Products</h4>
                            </div>
                        </div>
                        <div class="product__item__btn">
                            <a href="#" class="primary-btn">VIEW PRODUCT</a>
                        </div>
                    </div>
                </div>
                <!-- ITEM -->

            </div>
        </div>
    </section>
    <!-- Product -->

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer__top">
                <div class="row">
                    <div class="col-lg-6 col-md-6">
                        <div class="footer__top__logo">
                            <a href="#"><img src="img/logo.png" alt=""></a>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-6">
                        <div class="footer__top__social">
                            <a href="https://x.com/enidevstudio"><i class="fa fa-twitter"></i></a>
                            <a href="https://instagram.com/enigmadevelopmentstudio"><i class="fa fa-instagram"></i></a>
                            <a href="https://www.youtube.com/@EnigmaDevStudio"><i class="fa fa-youtube-play"></i></a>
                            <a href="https://github.com/enigmadevstudio"><i class="fa fa-github"></i></a>
                            <a href="https://t.me/enigmadevelopmentstudio"><i class="fa fa-telegram"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer__copyright">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <p class="footer__copyright__text">Copyright &copy;
                            2025 Enigma Development Studio. All rights reserved.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <!-- Footer -->

    <!-- Js Plugins -->
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/mixitup.min.js"></script>
    <script src="js/masonry.pkgd.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
